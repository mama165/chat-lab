name: Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

# A new push cancels the build still running for the same branch.
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK and run unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle with its caches
        # Restores the Gradle user home (downloads, wrapper, build cache) between runs.
        uses: gradle/actions/setup-gradle@v4

      - name: Accept the Android SDK licenses
        # The runner has the SDK; Gradle downloads the missing platform itself.
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null

      - name: Make the Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests and build the debug APK
        # One Gradle invocation: the project is configured once, and both tasks share it.
        run: ./gradlew testDebugUnitTest assembleDebug

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: chatlab-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
