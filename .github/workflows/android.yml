name: Android APK

on:
  # Only on pull requests: each push to a branch with an open PR already runs the PR check,
  # so a push trigger would run every job twice.
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

# A new push cancels the build still running for the same branch.
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK and run unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle with its caches
        # Restores the Gradle user home (downloads, wrapper, build cache) between runs.
        uses: gradle/actions/setup-gradle@v4

      - name: Accept the Android SDK licenses
        # The runner has the SDK; Gradle downloads the missing platform itself.
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null

      - name: Make the Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests and build the debug APK
        # One Gradle invocation: the project is configured once, and the tasks share it.
        # The test APK holds the Compose interface tests, run later on the emulator.
        run: ./gradlew testDebugUnitTest assembleDebug assembleDebugAndroidTest

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: chatlab-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload the interface tests APK
        uses: actions/upload-artifact@v4
        with:
          name: chatlab-test-apk
          path: android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 3

  # Runs only once the APK has been built: the screenshots show that exact build.
  screenshots:
    name: Screenshots, interface tests and monkey on an Android emulator
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Get the APK built by the previous job
        uses: actions/download-artifact@v4
        with:
          name: chatlab-debug-apk
          path: ci-apk

      - name: Get the interface tests APK
        uses: actions/download-artifact@v4
        with:
          name: chatlab-test-apk
          path: ci-test-apk

      - name: Allow the emulator to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Restore the emulator image from the cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api34-x86_64-${{ hashFiles('android/ci/capture.py') }}

      - name: Screenshots, then interface tests, then the monkey
        # 1. capture.py installs the app and takes the screenshots of each screen.
        # 2. instrumented.py runs the Compose tests: complete flows, with checks on what shows.
        # 3. monkey.py sends thousands of random actions and fails on any crash.
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          disable-spellchecker: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            python3 android/ci/capture.py
            python3 android/ci/instrumented.py
            python3 android/ci/monkey.py

      - name: Upload the screenshots and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatlab-screenshots
          path: android/ci/screens
          if-no-files-found: error
          retention-days: 14
