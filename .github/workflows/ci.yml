name: Chat-Lab CI

on:
  push:
    branches: main
  pull_request:
    branches: main

# Each job runs independently so that one red check never hides the others.
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Build binaries
        # Build with optimization flags for production
        run: go build -ldflags="-s -w" ./cmd/...

  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Verify Dependencies
        run: go mod verify

      - name: Vet Code
        run: go vet ./...

      - name: Check go fmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Error: Go files are not properly formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          # Pinned so that a new linter release cannot break the CI on its own.
          # Configuration lives in .golangci.yml.
          version: v2.15.0
          args: --timeout=5m

  security:
    name: Security (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Security Check (govulncheck)
        # Pinned so that a new release cannot break the CI on its own
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  generated:
    name: Generated Code (Mocks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Check generated code (Mocks)
        run: |
          go generate ./...
          if [ -n "$(git status --porcelain)" ]; then
            echo "Error: Mocks are out of date. Please run 'go generate ./...' and commit changes."
            git status
            exit 1
          fi

  tests:
    name: Tests (Race Detector)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Run Unit & Integration Tests (Race Detector)
        run: go test -v -race -count=1 ./...

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Run Benchmarks
        # Ensuring no performance regressions in storage.
        # -run='^$' runs benchmarks only, without re-running the tests.
        run: |
          set -o pipefail
          go test -run='^$' -bench=. -benchmem ./... | tee bench_output.txt
