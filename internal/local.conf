# ==============================================================================
# CONFIGURATION
# ==============================================================================

# Server & Network
# Address and port of the HTTP server (search API, monitoring pages).
# 127.0.0.1 only accepts connections from this machine.
MONITORING_HOST=127.0.0.1
MONITORING_PORT=8092
LOG_LEVEL=DEBUG

# Infrastructure (Databases)
BADGER_FILEPATH=/tmp/database/badger/dev
BLUGE_FILEPATH=/tmp/database/bluge/dev

# Pipeline & Buffers
BUFFER_SIZE=10
NUMBER_OF_WORKERS=30

# Timeouts & Intervals
METRIC_INTERVAL=2s
RESTART_INTERVAL=200ms
BUFFER_TIMEOUT=500ms

# Monitoring & Backpressure
LOW_CAPACITY_THRESHOLD=2

# Content Analysis Rules
MAX_ANALYZED_EVENT=500

# ------------------------------------------------------------------------------
# Specialists (PDF, Audio, Image)
# ------------------------------------------------------------------------------
ENABLE_SPECIALISTS=true
MAX_SPECIALIST_BOOT_DURATION=60s
SPECIALIST_TIMEOUT=10s

# ------------------------------------------------------------------------------
# File Scanner & Backpressure
# ------------------------------------------------------------------------------
# Folder scanned at startup (the -dir flag overrides it)
SCAN_ROOT_DIR=./test_data
SCANNER_WORKER_NB=10
# Number of files sent to the specialists at the same time
ANALYSIS_WORKER_NB=4
DRIVE_ID=os-main
MAX_FILE_SIZE_MB=100

# Thresholds for scanner throttling (in percent of fileChan capacity)
SCANNER_BACKPRESSURE_LOW_THRESHOLD_PERCENT=60
SCANNER_BACKPRESSURE_HARD_THRESHOLD_PERCENT=85